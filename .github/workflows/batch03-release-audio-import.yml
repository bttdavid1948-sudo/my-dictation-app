name: Batch03 exact immutable release audio import
on:
  push:
    branches: [main]
    paths:
      - operations/batch03-production/release-import-activation.json
permissions:
  contents: write
  actions: read
concurrency:
  group: official-man-batch03-release-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'bttdavid1948-sudo/my-dictation-app' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download exact already-produced outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37655070920 --repo bttdavid1948-sudo/my-dictation-app --name batch03-audio-production-37655070920 --dir release-production
          gh run download 37731209552 --repo bttdavid1948-sudo/my-dictation-app --name batch03-targeted-repair-37731209552 --dir release-repair
      - name: Verify hashes and prepare only authorized release audio
        run: python3 operations/batch03-production/import_release_audio.py
      - name: Push isolated review branch; never publish main directly
        run: |
          git switch -c ops/batch03-immutable-audio-import
          git config user.name 'Mặn Production Control'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/MAN-0067-*-batch03-v0.1.wav assets/audio/MAN-0167-*-batch03-v0.1.wav assets/audio/MAN-0367-*-batch03-v0.1.wav
          git commit -m 'Import hash-verified Batch03 finite release WAVs; no synthesis'
          git push origin HEAD:refs/heads/ops/batch03-immutable-audio-import
