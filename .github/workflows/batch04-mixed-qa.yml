name: Batch04 corrected mixed composition and C1 receipt read
on:
  push:
    branches: [main]
    paths: [.github/workflows/batch04-mixed-qa.yml]
permissions:
  contents: read
  actions: read
jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37773057735
          name: batch04-audio-production-37773057735
          path: retained-final
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37773887805
          name: batch04-targeted-repair-37773887805
          path: retained-repair2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37775480901
          name: batch04-c1-repairs-37775480901
          path: retained-c1
      - run: python3 -m pip install faster-whisper==1.2.1 scipy
      - run: python3 operations/batch04-production/read_c1.py
      - run: python3 operations/batch04-production/compose_read.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch04-mixed-evidence-${{ github.run_id }}
          path: batch04-mixed/
          retention-days: 7
