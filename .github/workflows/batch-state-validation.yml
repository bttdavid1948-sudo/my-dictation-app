name: Batch state and bounded resolver validation
on:
  pull_request:
    paths:
      - docs/content-pipeline/registry/official-1000-production-authority.json
      - docs/content-pipeline/registry/batch-02-watcher-pilot.json
      - docs/content-pipeline/registry/artifacts.json
      - docs/content-pipeline/registry/lessons.json
      - docs/content-pipeline/registry/support-bundles.json
      - docs/content-pipeline/registry/batch-02-completion-checkpoint.json
      - docs/content-pipeline/registry/batch-02-closure-evidence-index.json
      - docs/content-pipeline/registry/pipeline.json
      - docs/content-pipeline/registry/batch-01-completion-checkpoint.json
      - docs/content-pipeline/registry/batch-01-readiness.json
      - docs/content-pipeline/registry/batch-01-autonomous-orchestration-readiness.json
      - docs/content-pipeline/validate.mjs
      - docs/content-pipeline/validate-batch-state.mjs
      - operations/skills/**
      - docs/content-pipeline/registry/single-orchestrator-governance.json
      - docs/content-pipeline/registry/batch-02-operations-preparation-checkpoint.json
      - docs/content-pipeline/registry/batch-02-original-rights-preparation.json
      - operations/orchestration/**
      - .github/workflows/batch-state-validation.yml
      - .github/workflows/official-man-scoped-receipt-merge.yml
      - .github/workflows/official-man-curriculum-transition-merge.yml
      - .github/workflows/official-man-practice-transition-merge.yml
      - docs/content-pipeline/registry/batch-*-practice-preproduction.json
      - docs/content-pipeline/registry/batch-02-curriculum-preproduction.json
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/content-pipeline/validate.mjs next
      - run: node docs/content-pipeline/support-locale.mjs
      - run: node docs/content-pipeline/validate-batch-state.mjs
      - run: node operations/skills/module-tests.mjs
      - run: node operations/orchestration/resolve.test.mjs
      - run: node operations/orchestration/watchers/pilot.test.mjs
      - run: node operations/orchestration/watchers/scoped-merge.test.mjs
      - run: node operations/orchestration/watchers/curriculum-transition.test.mjs
      - run: node operations/orchestration/watchers/practice-transition.test.mjs
