name: MAN0844 exact mixed realization release verification
on:
  pull_request:
    paths:
      - assets/mixed-panel-runtime.js
      - assets/official-lessons-man0844.json
      - man0844-verification/**
      - .github/workflows/man0844-verification.yml
  push:
    branches: [main]
    paths:
      - assets/mixed-panel-runtime.js
      - assets/official-lessons-man0844.json
      - man0844-verification/**
      - .github/workflows/man0844-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mobile-release-runner
      - run: node mobile-release-runner/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exact release runtime checks (no Practice gate rerun)
        env:
          MAN_EXECUTION_MODE: ${{ matrix.mode }}
          MAN_VERIFY_TARGET: ${{ github.event_name == 'pull_request' && 'staging' || 'live' }}
        run: node man0844-verification/verify.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: man0844-${{ matrix.mode }}-${{ github.event_name }}
          path: man0844-verification/evidence/${{ matrix.mode }}/
          retention-days: 7
