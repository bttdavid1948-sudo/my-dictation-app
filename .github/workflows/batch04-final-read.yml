name: Batch04 retained final and repaired cue review
on:
  push:
    branches: [main]
    paths: [.github/workflows/batch04-final-read.yml]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37773057735
          name: batch04-audio-production-37773057735
          path: retained-final
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37773887805
          name: batch04-targeted-repair-37773887805
          path: retained-repair2
      - run: python3 -m pip install faster-whisper==1.2.1 scipy
      - run: python3 operations/batch04-production/read_final.py
