name: Isolated learner acceptance
on:
  push:
    branches: ['nonproduction/learner-reliability-e']
permissions:
  contents: read
concurrency:
  group: learner-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve pinned isolated dependencies and lock
        working-directory: nonproduction/learner-reliability
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Chromium
        working-directory: nonproduction/learner-reliability
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Actual desktop and mobile DOM acceptance
        id: browser
        continue-on-error: true
        run: node nonproduction/learner-reliability/learner-browser-check.mjs .
      - name: Actual Rules and compat SDK emulator acceptance
        id: emulator
        continue-on-error: true
        working-directory: nonproduction/learner-reliability
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-man-progress-acceptance --config firebase.emulator.json 'node firestore.progress.emulator.test.cjs && node cloud-progress.sdk-emulator.test.cjs'
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_USAGE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learner-isolated-evidence
          path: |
            nonproduction/learner-reliability/*receipt.json
            nonproduction/learner-reliability/package-lock.json
            nonproduction/learner-reliability/firestore-debug.log
      - name: Require both actual acceptance branches
        if: always()
        run: test '${{ steps.browser.outcome }}' = success && test '${{ steps.emulator.outcome }}' = success
