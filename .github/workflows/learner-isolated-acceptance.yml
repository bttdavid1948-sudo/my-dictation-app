name: Isolated learner acceptance
on:
  push:
    branches: ['nonproduction/learner-reliability-e-qa']
permissions:
  contents: read
concurrency:
  group: learner-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked isolated dependencies
        working-directory: nonproduction/learner-reliability
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Chromium
        working-directory: nonproduction/learner-reliability
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Final popup navigation desktop mobile acceptance
        id: browser
        continue-on-error: true
        run: node nonproduction/learner-reliability/learner-browser-check.mjs .
      - name: Final native immutable WAV playback
        id: audio
        continue-on-error: true
        run: node nonproduction/learner-reliability/real-audio.browser.mjs .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learner-isolated-evidence
          path: |
            nonproduction/learner-reliability/*receipt.json
            nonproduction/learner-reliability/package-lock.json
            nonproduction/learner-reliability/firestore-debug.log
      - name: Require both actual acceptance branches
        if: always()
        run: test '${{ steps.browser.outcome }}' = success && test '${{ steps.audio.outcome }}' = success
