name: Official MAN scoped receipt merge
on:
  workflow_run:
    workflows: [Batch state and bounded resolver validation]
    types: [completed]
    branches: [ops/watcher-activation-probe-v0.2]
permissions: {}
concurrency:
  group: official-man-scoped-receipt-merge-v0.2
  cancel-in-progress: false
jobs:
  receipt:
    if: github.repository == 'bttdavid1948-sudo/my-dictation-app' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Trusted default-branch code only; never check out the PR head or download artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node operations/orchestration/watchers/scoped-merge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN: ${{ github.sha }}
