name: Batch04 controlled learner release verification
on:
  pull_request:
    paths: [assets/official-lessons-batch04.json, assets/practice-runtime-wrapper.js, batch04-verification/**, .github/workflows/batch04-release-verify.yml]
  push:
    branches: [main]
    paths: [assets/official-lessons-batch04.json, assets/practice-runtime-wrapper.js, batch04-verification/**, .github/workflows/batch04-release-verify.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lesson: [MAN-0031, MAN-0271, MAN-0451, MAN-0581, MAN-0951]
        mode: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mobile-release-runner
      - run: node mobile-release-runner/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify default catalog integration with controlled doubles
        if: matrix.lesson == 'MAN-0031' && matrix.mode == 'desktop' && github.event_name == 'pull_request'
        run: node tests/practice-runtime-default.browser.mjs
      - name: Verify new exact learner outcomes once
        env:
          MAN_LESSON_ID: ${{ matrix.lesson }}
          MAN_EXECUTION_MODE: ${{ matrix.mode }}
          MAN_VERIFY_TARGET: ${{ github.event_name == 'push' && 'live' || 'staging' }}
        run: node batch04-verification/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch04-${{ github.event_name }}-${{ matrix.lesson }}-${{ matrix.mode }}
          path: batch04-verification/evidence/
          retention-days: 7
