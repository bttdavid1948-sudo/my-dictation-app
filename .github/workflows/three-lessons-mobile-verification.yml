name: Three Practice PASS lessons mobile live verification
on:
  pull_request:
    paths:
      - mobile-release-runner/verify-three-mobile.mjs
      - .github/workflows/three-lessons-mobile-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        lesson: [MAN-0165, MAN-0365, MAN-0044]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mobile-release-runner
      - run: node mobile-release-runner/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify exact live fixed realization independently
        env:
          MAN_MOBILE_PLAYWRIGHT_AUTHORIZED: '1'
          MAN_LESSON_ID: ${{ matrix.lesson }}
        run: node mobile-release-runner/verify-three-mobile.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-lessons-mobile-${{ matrix.lesson }}
          path: mobile-release-runner/evidence/${{ matrix.lesson }}/
          retention-days: 7
