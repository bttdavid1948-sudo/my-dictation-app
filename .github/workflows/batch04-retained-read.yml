name: Batch04 retained receipt and bounded PCM read
on:
  push:
    branches: [main]
    paths: [.github/workflows/batch04-retained-read.yml]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37772501746
          name: batch04-audio-production-37772501746
          path: retained
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37772501926
          name: batch04-targeted-repair-37772501926
          path: retained-repair
      - run: python3 -m pip install numpy scipy pocketsphinx==5.1.1
      - run: python3 operations/batch04-production/read_retained.py
